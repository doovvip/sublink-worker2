<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Surge 全功能合集生成器</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;background:#f5f5f7;margin:0}.w{max-width:680px;margin:auto;padding:28px 18px}.c{background:#fff;border-radius:22px;padding:22px}h1{margin-top:0}.i{display:block;border:1px solid #ddd;border-radius:15px;padding:14px;margin:10px 0}.b{width:100%;padding:15px;border:0;border-radius:15px;background:#0a84ff;color:#fff;font-size:17px;font-weight:700;margin-top:16px}.n{font-size:12px;color:#777;line-height:1.6}</style></head><body><div class="w"><div class="c"><h1>⚡ Surge 全功能合集</h1><p>勾选需要的功能，生成一个合集模块。</p><label class="i"><input type="checkbox" value="bili" checked> 📺 BiliBili 净化增强</label><label class="i"><input type="checkbox" value="youtube" checked> ▶️ YouTube 净化增强</label><label class="i"><input type="checkbox" value="ximalaya" checked> 🎧 喜马拉雅净化增强</label><label class="i"><input type="checkbox" value="startup"> 🚫 全局开屏去广告增强</label><button class="b" onclick="go()">生成合集模块</button><p class="n">生成后会下载一个 Surge全功能合集.sgmodule。再在 Surge 模块页面导入该文件。MITM 域名由所选模块精确合并，不使用 hostname=*。</p></div></div><script>const base='https://raw.githubusercontent.com/doovvip/sublink-worker2/main/surge-modules/';const urls={bili:base+'BiliBili_CN-V1.sgmodule',youtube:base+encodeURIComponent('YouTube净化增强.sgmodule'),ximalaya:base+encodeURIComponent('喜马拉雅净化增强新版.sgmodule'),startup:'https://raw.githubusercontent.com/Walvez/surge-startup-ads/main/dist/StartUpAds_Selected.sgmodule'};async function go(){let ks=[...document.querySelectorAll('input:checked')].map(x=>x.value);if(!ks.length)return alert('至少选择一个模块');let texts=await Promise.all(ks.map(k=>fetch(urls[k]).then(r=>{if(!r.ok)throw Error(k);return r.text()})));let sections={Rule:[],"URL Rewrite":[],Script:[]},hosts=[];for(let t of texts){for(let s of Object.keys(sections)){let m=t.match(new RegExp('\\['+s.replace(' ','\\s')+'\\]([\\s\\S]*?)(?=\\n\\[|$)'));if(m)sections[s].push(m[1].trim())}let mm=t.match(/\[MITM\]([\s\S]*?)(?=\n\[|$)/);if(mm){let h=mm[1].match(/hostname\s*=\s*(?:%APPEND%\s*)?([^\n]+)/i);if(h)hosts.push(...h[1].split(',').map(x=>x.trim()).filter(Boolean))}}hosts=[...new Set(hosts)];let out='#!name = ⚡ Surge 全功能合集\n#!desc = 按需动态生成｜'+ks.join(' + ')+'\n#!author = doovvip\n#!version = '+new Date().toISOString().slice(0,10)+'\n\n';for(let [s,a] of Object.entries(sections))if(a.length)out+='['+s+']\n'+a.join('\n')+'\n\n';if(hosts.length)out+='[MITM]\nhostname = %APPEND% '+hosts.join(', ')+'\n';let blob=new Blob([out],{type:'text/plain;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='Surge全功能合集.sgmodule';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}</script></body></html>

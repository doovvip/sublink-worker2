name: Repoint legacy raw URLs

on:
  push:
    branches:
      - migration/from-sublink-worker-2026-09-04
    paths:
      - .github/workflows/repoint-legacy-raw-urls.yml

permissions:
  contents: write

jobs:
  repoint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: migration/from-sublink-worker-2026-09-04
          fetch-depth: 1
      - name: Repoint copied remote assets to clean repository
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          roots = [
              Path('src'), Path('api'), Path('Module'), Path('Script'),
              Path('surge-modules'), Path('surge-scripts'), Path('permanent-assets')
          ]
          raw = re.compile(r'https://raw\.githubusercontent\.com/doovvip/sublink-worker/(?:main|[0-9a-f]{40})/')
          ghraw = re.compile(r'https://github\.com/doovvip/sublink-worker/raw/(?:main|[0-9a-f]{40})/')
          changed = []
          for root in roots:
              if not root.exists():
                  continue
              for path in root.rglob('*'):
                  if not path.is_file():
                      continue
                  try:
                      text = path.read_text(encoding='utf-8')
                  except UnicodeDecodeError:
                      continue
                  new = raw.sub('https://raw.githubusercontent.com/doovvip/sublink-worker2/main/', text)
                  new = ghraw.sub('https://raw.githubusercontent.com/doovvip/sublink-worker2/main/', new)
                  if new != text:
                      path.write_text(new, encoding='utf-8')
                      changed.append(str(path))
          print('\n'.join(changed))
          PY

          if grep -RniE 'https://raw\.githubusercontent\.com/doovvip/sublink-worker/(main|[0-9a-f]{40})/|https://github\.com/doovvip/sublink-worker/raw/(main|[0-9a-f]{40})/' \
            src api Module Script surge-modules surge-scripts permanent-assets 2>/dev/null; then
            echo 'Legacy raw URL remains after migration.' >&2
            exit 1
          fi
      - name: Commit URL cutover in staging branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'doovvip-migration'
          git config user.email '77657178+doovvip@users.noreply.github.com'
          git add src api Module Script surge-modules surge-scripts permanent-assets
          if git diff --cached --quiet; then
            echo 'No legacy raw URLs required changes.'
            exit 0
          fi
          git commit -m 'migration: repoint remote assets to sublink-worker2'
          git push origin HEAD:migration/from-sublink-worker-2026-09-04

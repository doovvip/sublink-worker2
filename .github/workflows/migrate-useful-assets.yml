name: Migrate useful legacy assets

on:
  push:
    branches:
      - migration/from-sublink-worker-2026-09-04
    paths:
      - .github/workflows/migrate-useful-assets.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout clean destination
        uses: actions/checkout@v4
        with:
          ref: migration/from-sublink-worker-2026-09-04
          fetch-depth: 1

      - name: Fetch legacy public repository
        run: git clone --depth 1 https://github.com/doovvip/sublink-worker.git /tmp/legacy

      - name: Copy useful server code and Surge assets
        shell: bash
        run: |
          set -euo pipefail

          copy_file() {
            src="$1"
            dst="$2"
            if [ -f "/tmp/legacy/$src" ]; then
              mkdir -p "$(dirname "$dst")"
              cp "/tmp/legacy/$src" "$dst"
            fi
          }

          copy_dir() {
            src="$1"
            dst="$2"
            if [ -d "/tmp/legacy/$src" ]; then
              rm -rf "$dst"
              mkdir -p "$(dirname "$dst")"
              cp -a "/tmp/legacy/$src" "$dst"
            fi
          }

          # Server customizations that do not exist, or are newer, in sublink-worker2.
          copy_file src/tanzouSubscription.js src/tanzouSubscription.js
          copy_file src/unifiedSubscription.js src/unifiedSubscription.js
          copy_file src/taobaoPriceWeb.js src/taobaoPriceWeb.js
          copy_file src/surgeModules.js src/surgeModules.js
          copy_file src/worker.jsx src/worker.jsx
          copy_file api/index.js api/index.js
          copy_file api/all-clean.js api/all-clean.js

          # Surge modules/scripts that are still used as remote raw assets.
          copy_dir Module Module
          copy_dir Script Script
          copy_dir surge-modules surge-modules
          copy_dir surge-scripts surge-scripts
          copy_dir permanent-assets/r2-2026-09-03 permanent-assets/r2-2026-09-03

          # Keep deployment references for later cut-over without activating them yet.
          mkdir -p migration-reference
          copy_file wrangler.toml migration-reference/wrangler.sublink-worker.toml
          copy_file .github/workflows/deploy.yml migration-reference/deploy-cloudflare.yml

          # Explicitly keep retired/public-profile artifacts out of the clean replacement.
          rm -f api/r2-public.js api/surge-r2.js
          rm -rf surge-config

      - name: Safety check copied files
        shell: bash
        run: |
          set -euo pipefail
          if grep -RniE 'ca-p12|ca-passphrase|rlkey=' \
            src api Module Script surge-modules surge-scripts permanent-assets migration-reference 2>/dev/null; then
            echo 'Sensitive Surge material detected; refusing migration commit.' >&2
            exit 1
          fi

      - name: Commit migration snapshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'doovvip-migration'
          git config user.email '77657178+doovvip@users.noreply.github.com'
          git add src api Module Script surge-modules surge-scripts permanent-assets migration-reference
          if git diff --cached --quiet; then
            echo 'Nothing to migrate.'
            exit 0
          fi
          git commit -m 'migration: preserve useful server and Surge assets'
          git push origin HEAD:migration/from-sublink-worker-2026-09-04

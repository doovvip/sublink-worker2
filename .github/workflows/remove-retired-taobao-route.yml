name: Remove retired Taobao route from migration

on:
  push:
    branches:
      - migration/from-sublink-worker-2026-09-04
    paths:
      - .github/workflows/remove-retired-taobao-route.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: migration/from-sublink-worker-2026-09-04
          fetch-depth: 1
      - name: Remove broken retired Taobao imports and routes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              'src/worker.jsx': [
                  "import { handleTaobaoPricePage } from './taobaoPriceWeb.js';\n",
                  "        if (url.pathname === '/taobao-price' || url.pathname === '/api/taobao-price') return handleTaobaoPricePage(request);\n",
              ],
              'api/index.js': [
                  "// Taobao price web endpoint build trigger 2026-08-29 00:38\n",
                  "import { handleTaobaoPricePage } from '../src/taobaoPriceWeb.js';\n",
                  "        } else if (url.pathname === '/taobao-price' || url.pathname === '/api/taobao-price') {\n            response = await handleTaobaoPricePage(request);\n",
              ],
          }

          for name, needles in replacements.items():
              path = Path(name)
              text = path.read_text(encoding='utf-8')
              for needle in needles:
                  if needle not in text:
                      raise SystemExit(f'Expected retired Taobao fragment not found in {name}: {needle!r}')
                  text = text.replace(needle, '')
              path.write_text(text, encoding='utf-8')
          PY
      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'doovvip-migration'
          git config user.email '77657178+doovvip@users.noreply.github.com'
          git add src/worker.jsx api/index.js
          git commit -m 'migration: remove retired broken Taobao route'
          git push origin HEAD:migration/from-sublink-worker-2026-09-04

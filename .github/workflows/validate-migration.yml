name: Validate legacy migration

on:
  push:
    branches:
      - migration/from-sublink-worker-2026-09-04
    paths:
      - src/**
      - api/**
      - Module/**
      - Script/**
      - surge-modules/**
      - surge-scripts/**
      - permanent-assets/**
      - migration-reference/**
      - .github/workflows/validate-migration.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: migration/from-sublink-worker-2026-09-04
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Security assertions
        shell: bash
        run: |
          set -euo pipefail
          ! grep -RniE 'ca-p12|ca-passphrase|rlkey=' src api Module Script surge-modules surge-scripts permanent-assets migration-reference 2>/dev/null
          test ! -e surge-config/Surge.conf
          test ! -e api/r2-public.js
          test ! -e api/surge-r2.js
          ! grep -RniE 'https://raw\.githubusercontent\.com/doovvip/sublink-worker/(main|[0-9a-f]{40})/|https://github\.com/doovvip/sublink-worker/raw/(main|[0-9a-f]{40})/' src api Module Script surge-modules surge-scripts permanent-assets 2>/dev/null
      - name: Server unit tests
        run: npx vitest run --exclude 'surge-scripts/**'
      - name: Vercel build
        run: npm run build

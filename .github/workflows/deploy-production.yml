name: Deploy Production Worker

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type DEPLOY to confirm production deployment'
        required: true
        default: ''

permissions:
  contents: read

jobs:
  deploy:
    if: github.event.inputs.confirm == 'DEPLOY'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Validate required Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo 'Missing CLOUDFLARE_API_TOKEN'; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo 'Missing CLOUDFLARE_ACCOUNT_ID'; exit 1; }

      - name: Static security gates
        shell: bash
        run: |
          set -euo pipefail
          files='src/dropboxOAuth.js src/privateSurgeDelivery.js src/worker.jsx'
          if grep -nE 'SURGE_DELIVERY_KEY|DROPBOX_APP_SECRET|DROPBOX_ACCESS_TOKEN|DROPBOX_REFRESH_TOKEN|privateMaintenanceOnce|migrateStoredDropboxRefreshTokenEncryption' $files; then
            echo 'Legacy credential coupling remains in production source.'
            exit 1
          fi
          if grep -nE "'/private/(master|Master\.conf|Surge\.conf)'" src/privateSurgeDelivery.js; then
            echo 'Remote master route remains enabled.'
            exit 1
          fi
          if grep -nE 'handleTanzouSubscription|handleUnifiedSubscription|s-maxage=' api/index.js; then
            echo 'Legacy Vercel subscription handler/cache returned.'
            exit 1
          fi
          grep -Fq "url.pathname === '/tanzou' || url.pathname === '/all'" api/index.js || {
            echo 'Vercel /tanzou and /all retirement guard is missing.'
            exit 1
          }

      - name: Server unit tests
        run: npx vitest run test --exclude 'surge-scripts/**'

      - name: Deploy new production Worker
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy --config wrangler.toml 2>&1 | tee deploy.log
          sed -r 's/\x1B\[[0-9;]*[mK]//g' deploy.log > deploy.clean.log
          WORKER_URL="$(grep -Eo 'https://[A-Za-z0-9.-]+\.workers\.dev' deploy.clean.log | tail -1)"
          test -n "$WORKER_URL"
          echo "WORKER_URL=$WORKER_URL" >> "$GITHUB_ENV"

      - name: Smoke test hardened production routes
        shell: bash
        run: |
          set -euo pipefail

          probe() {
            name="$1"
            url="$2"
            expected="$3"
            file="/tmp/${name}.out"
            for i in $(seq 1 12); do
              code="$(curl -sS -o "$file" -w '%{http_code}' "$url" || true)"
              echo "$name attempt $i: HTTP $code"
              if [ "$code" = "$expected" ]; then
                return 0
              fi
              sleep 5
            done
            echo "$name failed; expected HTTP $expected"
            return 1
          }

          probe health "$WORKER_URL/health" 200
          test "$(cat /tmp/health.out)" = "OK"

          probe modules "$WORKER_URL/surge-modules" 200
          grep -q '7 个独立模块' /tmp/modules.out
          grep -q '美图秀秀' /tmp/modules.out
          grep -q '红果短剧' /tmp/modules.out

          probe full "$WORKER_URL/surge-module?modules=youtube,jd,startup,bili,kuwo,meitu,hongguo" 200
          grep -q '^#!name = ⚡ Surge 正式母版合集' /tmp/full.out
          grep -q '^\[Script\]' /tmp/full.out
          grep -q '^\[MITM\]' /tmp/full.out

          probe surge_nodes "$WORKER_URL/surge-nodes" 404
          probe oauth "$WORKER_URL/dropbox-oauth" 404
          probe maintenance "$WORKER_URL/private/_maintenance-once" 404
          probe private_master "$WORKER_URL/private/master" 404
          probe private_r2 "$WORKER_URL/private/R2.conf" 404
          probe tanzou "$WORKER_URL/tanzou" 404
          probe all "$WORKER_URL/all" 404
